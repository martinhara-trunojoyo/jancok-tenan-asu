<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNAP! 1986 - Photo Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>

<main class="cab">
  <div class="marquee">
    <span class="m1">SNAP!</span><span class="m2">1986</span>
    <div class="sub">P H O T O &nbsp; H U N T E R</div>
  </div>

  <div id="screen">
    <canvas id="game" width="320" height="180"></canvas>
    <div class="crt"></div>
    <div class="scan"></div>
    <div id="overlay"></div>
  </div>

  <div class="ctl">
    <span><b>MOUSE</b> aim viewfinder</span>
    <span><b>SPACE / CLICK</b> snap!</span>
    <span><b>R</b> retry mode</span>
    <span><b>M</b> sound</span>
    <span id="imgState">SUBJECT: LOADING</span>
    <button id="soundBtn" type="button">SOUND: ON</button>
  </div>
</main>

<script src="game.js"></script>
</body>
</html>
